<svg width="3600" height="4800" viewBox="0 0 3600 4800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Synthesis Hacks back of shirt sponsor design</title>
  <desc>One-color Synthesis Hacks back-of-shirt design using the site accent green.</desc>
  <defs>
    <style>
      .ink { color: #c4ff50; }
      .line { stroke: #c4ff50; stroke-width: 16; stroke-linecap: square; stroke-linejoin: miter; }
      .thin { stroke: #c4ff50; stroke-width: 9; stroke-linecap: square; stroke-linejoin: miter; }
      .micro { stroke: #c4ff50; stroke-width: 6; stroke-linecap: square; stroke-linejoin: miter; }
      .fill { fill: #c4ff50; }
      .display {
        fill: #c4ff50;
        font-family: Fraunces, Georgia, serif;
        font-weight: 300;
      }
      .mono {
        fill: #c4ff50;
        font-family: "DM Mono", "SFMono-Regular", Consolas, monospace;
        font-weight: 500;
        letter-spacing: 24px;
      }
    </style>
    <g id="side-ornament">
      <path class="line" d="M0 0h210v210" />
      <path class="line" d="M210 340v315h-118" />
      <path class="line" d="M92 840h118v342" />
      <path class="line" d="M210 1360v330H0" />
      <path class="thin" d="M70 210v190" />
      <path class="thin" d="M70 655v185" />
      <path class="thin" d="M70 1182v178" />
      <path class="micro" d="M210 104h96" />
      <path class="micro" d="M210 498h96" />
      <path class="micro" d="M210 1010h96" />
      <path class="micro" d="M210 1518h96" />
      <rect class="fill" x="48" y="382" width="44" height="44" />
      <rect class="fill" x="188" y="818" width="44" height="44" />
      <rect class="fill" x="48" y="1338" width="44" height="44" />
      <circle class="fill" cx="210" cy="210" r="24" />
      <circle class="fill" cx="210" cy="655" r="24" />
      <circle class="fill" cx="210" cy="1182" r="24" />
      <circle class="fill" cx="210" cy="1690" r="24" />
    </g>
    <g id="corner-burst">
      <path class="thin" d="M0 90h180" />
      <path class="thin" d="M90 0v180" />
      <path class="micro" d="M28 28l124 124" />
      <path class="micro" d="M152 28L28 152" />
      <rect class="fill" x="75" y="75" width="30" height="30" />
    </g>
  </defs>

  <g class="ink">
