      <image href="sponsor-logos-green/art-of-problem-solving-green.png" x="1070" y="0" width="760" height="267" preserveAspectRatio="xMidYMid meet" />
      <image href="sponsor-logos-green/equinix-green.svg" x="2090" y="-26" width="350" height="228" preserveAspectRatio="xMidYMid meet" />
    </g>

    <g transform="translate(845 2505)">
      <image href="sponsor-logos-green/arrcus-green.svg" x="0" y="0" width="520" height="144" preserveAspectRatio="xMidYMid meet" />
      <image href="sponsor-logos-green/omi-green.svg" x="760" y="-20" width="470" height="145" preserveAspectRatio="xMidYMid meet" />
      <image href="sponsor-logos-green/xyz-green.png" x="1510" y="-18" width="350" height="205" preserveAspectRatio="xMidYMid meet" />
